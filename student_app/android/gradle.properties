# 4 GB is enough for this app and leaves room for the demo stack (Postgres,
# Redis, PM2 x4, monitoring). Gradle gives each worker its own heap slice, so
# the default parallel worker count can exhaust RAM on a 16 GB machine.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# R8 and the three per-plugin lintVital tasks run concurrently otherwise, which
# aborted the release build with no error output on this machine.
org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
