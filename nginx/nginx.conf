# =============================================================================
# HostelGuard — Production Nginx Configuration
# =============================================================================
# TLS termination + reverse proxy + WebSocket upgrade for the API cluster.
# Place TLS certs at nginx/certs/fullchain.pem and nginx/certs/privkey.pem.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------------------
    # Upstream: API instances (Docker Compose service discovery)
    # -------------------------------------------------------------------------
    upstream api_backend {
        # Docker Compose DNS resolves "api" to all replicas
        server api:3001;
    }

    # -------------------------------------------------------------------------
    # Rate limiting zones
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_global:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=sos_zone:10m rate=5r/m;

    # -------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS server
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Gzip
        gzip on;
        gzip_types application/json text/plain text/css application/javascript;

        # ---- API proxy -------------------------------------------------------
        location / {
            limit_req zone=api_global burst=20 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;

            # WebSocket upgrade (Socket.IO)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts for WebSocket long-lived connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ---- Health check (no rate limit) ------------------------------------
        location /health {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ---- Metrics (internal only) -----------------------------------------
        location /metrics {
            # Restrict to internal / Prometheus scraper IPs
            # allow 10.0.0.0/8;
            # deny all;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
