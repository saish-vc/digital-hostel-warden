# ---------------------------------------------------------------------------
# Nginx front door for 3 API instances (3001/3002/3003).
#
# RECOMMENDED DEMO SETUP: clients use `transports: ["websocket"]` only
# (dashboard + Flutter app). WebSocket connections are single, long-lived TCP
# connections, so NO sticky session is required: nginx picks an upstream once
# at connect time and the connection stays there. The affinity directives
# below exist only for the HTTP long-polling fallback.
#
# TRADE-OFF: skipping polling means a restrictive network that blocks
# WebSocket gets no fallback. The hostel network is closed and known, so this
# is acceptable for the demo. For production, either keep WebSocket-only
# (best) or use the sticky-session directives here.
#
# If you DO enable polling, use `hash $remote_addr consistent` (or a
# cookie-based affinity) or polling requests will land on an instance that
# does not own the session and Socket.IO will 400 with
# "Session ID unknown". `hash $remote_addr` is weak when many clients share
# one NAT (all hostel wardens on the same Wi-Fi hash to ONE instance), so a
# cookie-based affinity is better if you control both ends.
# ---------------------------------------------------------------------------

# Two workers is plenty for a single-host demo; `auto` spawns one per core
# (17 on this machine), which is wasteful next to the Node/Postgres stack.
worker_processes 2;

events {
    worker_connections 1024;
}

http {
    # No `include mime.types;`: this config only proxies JSON and WebSocket
    # traffic, so the static MIME table is unused. Dropping it also keeps the
    # file portable — nginx resolves relative includes against the config
    # file's directory, which would otherwise require mime.types next to this
    # file on every machine.
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream backend {
        # ROUND-ROBIN by default. With WebSocket-only clients no affinity is
        # needed: each socket is one long-lived TCP connection, pinned at
        # connect time. Do NOT re-enable `hash $remote_addr` for the demo:
        # every warden behind one hostel NAT would hash to a single instance,
        # and REST distribution (F4) could not be demonstrated from localhost.
        #
        # IF YOU ENABLE POLLING, use `hash $remote_addr consistent` (or a
        # cookie-based affinity) or polling requests will land on an instance
        # that does not own the session and Socket.IO will 400 with
        # "Session ID unknown".
        #
        # Cookie-based alternative: the Socket.IO @socket.io/sticky package
        # sets an `io` cookie and you map it here:
        #   map $cookie_io $sticky_upstream { default backend; }
        # That requires the app to run behind @socket.io/sticky, which is the
        # Node-level fallback when you cannot configure the platform LB.

        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3003 max_fails=3 fail_timeout=10s;

        # OSS nginx has NO active health checks. max_fails/fail_timeout above
        # are PASSIVE: an instance is ejected after 3 failed proxied requests
        # and retried after 10s. GET /health returning 503 when Redis/Postgres
        # is down makes those failures count.
        #
        # nginx PLUS only (uncomment there; syntax errors on OSS):
        # health_check uri=/health interval=5s fails=3 passes=2;
    }

    server {
        listen 8080;
        server_name _;

        # Socket.IO endpoint: upgrade + long timeouts + no buffering.
        location /socket.io/ {
            proxy_pass http://backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Events must be flushed immediately; buffering delays
            # alert:new by up to the buffer timeout.
            proxy_buffering off;

            # Long-lived sockets: do not drop after the default 60s.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # REST API + health.
        location / {
            proxy_pass http://backend;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_503;
        }
    }
}
