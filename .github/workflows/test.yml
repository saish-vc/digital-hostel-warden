name: Backend tests

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vitest (Postgres 16 + Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        # The backend is its own npm project inside the repository.
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hostel_emergency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hostel_emergency_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hostel_emergency_test?schema=public
      # schema.prisma declares directUrl = env("DIRECT_DATABASE_URL"), and the
      # Prisma CLI validates the whole datasource block even for `migrate
      # deploy`. Without this the migration step fails with P1012.
      # CI has no PgBouncer, so direct = pooled.
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hostel_emergency_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-only-test-secret-do-not-use-outside-ci
      ESCALATION_DELAY_MS: '500'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # Same `npm test` script developers run, with coverage enabled so the
      # artifact below is always produced. The 70% thresholds in
      # vitest.config.ts fail this step if coverage regresses.
      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7
          if-no-files-found: warn

      # Logs from a failed run are often the fastest way to see which BullMQ
      # job or socket left a handle open.
      - name: Upload vitest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-logs
          path: |
            backend/coverage
            backend/*.log
          retention-days: 3
          if-no-files-found: ignore

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warden-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: warden-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com
