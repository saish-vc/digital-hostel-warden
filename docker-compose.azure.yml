name: hostelguard

x-backend-build: &backend-build
  context: ./backend
  target: production

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://hostelguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong hex string}@postgres:5432/hostel_emergency?schema=public&connection_limit=5
  DIRECT_DATABASE_URL: postgresql://hostelguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong hex string}@postgres:5432/hostel_emergency?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD to a strong hex string}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET}
  METRICS_TOKEN: ${METRICS_TOKEN:?Set a strong METRICS_TOKEN}
  DASHBOARD_ORIGIN: https://${DOMAIN:?Set DOMAIN}
  DASHBOARD_URL: https://${DOMAIN:?Set DOMAIN}
  CORS_ORIGIN: ${CORS_ORIGIN:-}
  ENABLE_HTTPS_REDIRECT: "false"
  INTERNAL_API_URL: http://api:3001
  FIREBASE_SERVICE_ACCOUNT_B64: ${FIREBASE_SERVICE_ACCOUNT_B64:-}
  SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
  WARDEN_ONCALL_PHONE: ${WARDEN_ONCALL_PHONE:-}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hostelguard
      POSTGRES_DB: hostel_emergency
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong hex string}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostelguard -d hostel_emergency"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD to a strong hex string}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: migration
    restart: "no"
    environment:
      DATABASE_URL: postgresql://hostelguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong hex string}@postgres:5432/hostel_emergency?schema=public
      DIRECT_DATABASE_URL: postgresql://hostelguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong hex string}@postgres:5432/hostel_emergency?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *backend-build
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      <<: *app-environment
      PORT: "3001"
    depends_on: *app-depends
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build: *backend-build
    restart: unless-stopped
    deploy:
      replicas: 1
    command: ["node", "dist/workers/escalation.worker.js"]
    environment:
      <<: *app-environment
      WORKER_METRICS_PORT: "4001"
    depends_on:
      <<: *app-depends
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4001/metrics?token='+encodeURIComponent(process.env.METRICS_TOKEN),r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  leave-worker:
    build: *backend-build
    restart: unless-stopped
    deploy:
      replicas: 1
    command: ["node", "dist/workers/leave-overdue.worker.js"]
    environment:
      <<: *app-environment
      LEAVE_WORKER_METRICS_PORT: "4002"
    depends_on: *app-depends
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4002/metrics?token='+encodeURIComponent(process.env.METRICS_TOKEN),r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    build:
      context: ./warden-dashboard
      args:
        VITE_API_URL: https://${DOMAIN:?Set DOMAIN}/api
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/azure/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/hostelguard/acme:/var/www/certbot:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["envsubst '$${DOMAIN}' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
